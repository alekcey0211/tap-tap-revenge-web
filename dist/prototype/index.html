<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#070617">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; connect-src 'self'; media-src 'self' blob:; object-src 'none'; base-uri 'none'">
  <title>Pulse / Stage Lab · Babylon.js</title>
  <link rel="stylesheet" href="stage.css?v=1">
  <script type="module" src="stage.js?v=1"></script>
</head>
<body>
  <canvas id="stage" aria-label="Объёмная концертная сцена. Автодемонстрация эффектов." role="img"></canvas>
  <header>
    <a class="back" href="../#/" aria-label="Вернуться в рабочую игру">‹</a>
    <div><span class="eyebrow">TAP TAP / EXPERIMENT</span><h1>STAGE<span> LAB</span></h1></div>
    <div class="engine"><strong id="backend">Подготовка…</strong><small id="fps">LAB 0.1</small></div>
  </header>
  <main>
    <div class="energy" id="energy" data-active="true"><span id="energy-caption">ЭНЕРГИЯ СЦЕНЫ</span><strong id="energy-value">×8</strong><span id="judgment">ПОЧУВСТВУЙ РИТМ</span></div>
    <div class="dock">
      <div class="track-line"><img id="cover" alt=""><div><strong id="track-name">Готовим сцену</strong><span id="track-meta">Автодемо · без рекордов</span></div><output id="clock">0:00</output></div>
      <div class="timeline"><div id="timeline-fill"></div></div>
      <div class="controls">
        <button id="play" class="primary" disabled>▶ С музыкой</button>
        <button id="energy-toggle" aria-pressed="true">×8 включён</button>
      </div>
      <div class="secondary"><button id="silent" disabled>Смотреть без звука</button><button id="restart" disabled>Сначала</button><button id="options-toggle" aria-expanded="false" aria-controls="options">Параметры</button></div>
      <div id="options" hidden>
        <label>Трек<select id="song" disabled></select></label>
        <label>Графика<select id="renderer"><option value="auto">WebGPU → WebGL</option><option value="webgl">Только WebGL</option></select></label>
        <label class="motion"><input id="reduced" type="checkbox">Меньше эффектов</label>
        <p>Это отдельный прототип. Сохранения не используются. Для просмотра нужен интернет. <a href="licenses.html">Babylon.js 9.32.1</a></p>
      </div>
      <p id="status" role="status">Создаём сцену и загружаем трек…</p>
      <button id="reload" hidden>Повторить загрузку</button>
    </div>
  </main>
</body>
</html>
