name: Check game

on:
  push:
    branches: [codex/development]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install renderer dependencies
        run: npm ci --prefix prototype
      - name: Build stable game
        run: npm run build
      - name: Test scene
        run: npm run test:scene
      - name: Test game
        run: npm test
      - name: Check public artifact
        run: node scripts/check-release.mjs
